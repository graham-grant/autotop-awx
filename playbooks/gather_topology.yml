---
# Gathers interface facts, interface state, and IP addressing from every
# host in the `network_devices` group via NAPALM, then writes one JSON file
# per host to output/facts/. Run scripts/main.py afterwards to turn that
# into a drawio diagram. Adjacency is derived from directly-connected
# subnets (two hosts with an IP in the same subnet are linked), not LLDP -
# see scripts/parser.py for why.
#
# Usage:
#   export NAPALM_USERNAME=admin
#   export NAPALM_PASSWORD=secret
#   ansible-playbook -i inventory.yml playbooks/gather_topology.yml

- name: Prepare output directory
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Ensure output/facts directory exists
      file:
        path: "{{ playbook_dir }}/../output/facts"
        state: directory
        mode: "0755"

- name: Gather interface and addressing data from all inventory devices
  hosts: network_devices
  connection: local
  gather_facts: no
  #Custom SSH vars injected into NAPALM NetMiko to allow management of IOSV routers
  #Only for lab environment
  vars:
    napalm_ssh_config:
      KexAlgorithms: "+diffie-hellman-group14-sha1"
      HostKeyAlgorithms: "+ssh-rsa"
      PubKeyAcceptedKeyTypes: "+ssh-rsa"
      MACs: "+hmac-sha1"
  tasks:
    - name: Get facts, interface state, and IPs via NAPALM
      napalm.napalm.get_facts:
        hostname: "{{ ansible_host }}"
        username: "{{ napalm_username }}"
        password: "{{ napalm_password }}"
        dev_os: "{{ ansible_network_os }}"
        filter:
          - facts
          - interfaces
          - interfaces_ip
        optional_args:
          ssh_config: "{{ napalm_ssh_config }}"
          global_delay_factor: 2
      register: napalm_result

    - name: Write this host's facts and interface data to a JSON file
      copy:
        dest: "{{ playbook_dir }}/../output/facts/{{ inventory_hostname }}.json"
        content: "{{ node_record | to_nice_json }}"
      vars:
        node_record:
          inventory_name: "{{ inventory_hostname }}"
          hostname: "{{ napalm_result.ansible_facts.napalm_hostname | default(inventory_hostname) }}"
          interfaces: "{{ napalm_result.ansible_facts.napalm_interfaces | default({}) }}"
          interfaces_ip: "{{ napalm_result.ansible_facts.napalm_interfaces_ip | default({}) }}"

- name: Build the drawio diagram and publish it as a job artifact
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run main.py against the gathered facts
      command: >-
        python3 {{ playbook_dir }}/../scripts/main.py
        {{ playbook_dir }}/../output/facts
        {{ playbook_dir }}/../output
      register: build_result

    - name: Show build script output in the job log
      debug:
        var: build_result.stdout_lines

    - name: Read the generated drawio file
      slurp:
        src: "{{ playbook_dir }}/../output/topology.drawio"
      register: drawio_file

    - name: Build the drawio diagram and publish it as a job artifact
    hosts: localhost
    connection: local
    gather_facts: no
    tasks:
        - name: Run main.py against the gathered facts
        command: >-
            python3 {{ playbook_dir }}/../scripts/main.py
            {{ playbook_dir }}/../output/facts
            {{ playbook_dir }}/../output
        register: build_result

        - name: Show build script output in the job log
        debug:
            var: build_result.stdout_lines

    - name: Push generated diagram to artifact server
    hosts: artifact_server
    gather_facts: no
    tasks:
        - name: Copy topology.drawio to artifact server
        ansible.builtin.copy:
            src: "{{ playbook_dir }}/../output/topology.drawio"
            dest: /srv/diagrams/topology.drawio
